# Counterpuck: an open firmware that behaves like a Steam Controller 2 puck on an nRF52840 board.
# Settings you may want to change (serials, USB strings, build time) are in src/puck_config.h.

# --- kernel ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_EVENTS=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_GPIO=y

# The board has no 32.768 kHz crystal: use the internal RC oscillator, calibrated against the
# on-chip temperature sensor.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y

# --- USB: Zephyr's own device stack, one serial port + five HID interfaces ---
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
# Up to 8 input reports per interface can be on their way to the host at once.
CONFIG_USBD_HID_IN_BUF_COUNT=8
CONFIG_USBD_CDC_ACM_CLASS=y
# The serial port carries the shell, so the USB stack must not log every transfer into it.
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_UDC_BUF_POOL_SIZE=4096
# Vendor commands that store a pairing run in the USB thread, together with the flash driver.
CONFIG_USBD_THREAD_STACK_SIZE=2048

# --- shell and logging on the USB serial port ---
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_PROMPT_UART="dongle~$ "
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# --- radio: Nordic's Enhanced ShockBurst ---
CONFIG_ESB=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=128
CONFIG_ESB_TX_FIFO_SIZE=2
CONFIG_ESB_RX_FIFO_SIZE=2

# --- pairing records in flash ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
